<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <meta name="description" content="LegalEase - Simple and secure online legal document preparation.">

    <title>LegalEase</title>

    <!-- Google Font - Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>


    <!-- ==========================================
     LOGIN PAGE CONTROLS
========================================== -->

    <div class="legalease-login-controls">

        <!-- Dark Mode -->
        <button type="button" class="legalease-login-control" id="legalease-theme-toggle" aria-label="Toggle dark mode"
            title="Dark Mode">

            <i class="fa-solid fa-moon"></i>

        </button>

        <!-- RTL Mode -->
        <button type="button" class="legalease-login-control" id="legalease-rtl-toggle" aria-label="Toggle RTL mode"
            title="RTL Mode">

            <i class="fa-solid fa-right-left"></i>

        </button>

    </div>

    <!-- ==========================================
         LOGIN PAGE
    ========================================== -->

    <main class="legalease-login-page">

        <div class="legalease-login-card">

            <!-- Logo -->
            <div class="legalease-login-logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="LegalEase">
                </a>
            </div>

            <!-- Heading -->
            <div class="legalease-login-heading">

                <h1>
                    Sign In To Your Account
                </h1>

                <p>
                    Login to continue your legal document
                    preparation journey with LegalEase.
                </p>

            </div>

            <!-- Login Form -->
            <form class="legalease-login-form">

                <!-- Email -->
                <div class="legalease-login-field">

                    <label for="legalease-login-email">
                        Email Address
                    </label>

                    <input type="email" id="legalease-login-email" name="email" placeholder="Enter your email"
                        autocomplete="email" required>

                </div>

                <!-- Password -->
                <div class="legalease-login-field">

                    <label for="legalease-login-password">
                        Password
                    </label>

                    <div class="legalease-login-password-wrap">

                        <input type="password" id="legalease-login-password" name="password"
                            placeholder="Enter your password" autocomplete="current-password" required>

                        <button type="button" class="legalease-login-password-toggle" id="legalease-password-toggle"
                            aria-label="Show password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>

                <!-- Remember / Forgot -->
                <div class="legalease-login-options">

                    <label class="legalease-login-remember">

                        <input type="checkbox" name="remember">

                        <span>
                            Remember Me
                        </span>

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <!-- Login Button -->
                <button type="submit" class="legalease-login-button">

                    Login

                </button>

            </form>

            <!-- Divider -->
            <div class="legalease-login-divider">

                <span></span>

                <p>
                    Or Continue With
                </p>

                <span></span>

            </div>

            <!-- Social Login -->
            <div class="legalease-login-socials">

                <a href="#" class="legalease-login-social" aria-label="Continue with Google">

                    <img src="images/google-logo.svg" alt="Google">

                </a>

                <a href="#" class="legalease-login-social" aria-label="Continue with Facebook">

                    <i class="fa-brands fa-facebook-f"></i>

                </a>

                <a href="#" class="legalease-login-social" aria-label="Continue with Apple">

                    <i class="fa-brands fa-apple"></i>

                </a>

                <a href="#" class="legalease-login-social" aria-label="Continue with X">

                    <i class="fa-brands fa-x-twitter"></i>

                </a>

            </div>

            <!-- Register -->
            <div class="legalease-login-register">

                <span>
                    Don't have an account?
                </span>

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </div>

    </main>

    <!-- ==========================================
     JavaScript
     ========================================== -->

    <script src="js/main.js"></script>

</body>

</html>
